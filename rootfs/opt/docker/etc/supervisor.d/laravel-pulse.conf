[program:laravel-pulse]
command=/opt/docker/bin/service.d/laravel-optional.sh laravel/pulse pulse:check
user=application
autorestart=true
startretries=9999
stopwaitsecs=3600
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
; This suppresses supervisor (but not pulse) errors on stdout when the command fails
redirect_stderr=true
