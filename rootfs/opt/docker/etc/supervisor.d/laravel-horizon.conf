[program:laravel-horizon]
process_name=%(program_name)s
command=/opt/docker/bin/service.d/laravel-optional.sh laravel/horizon horizon --no-interaction
startretries=9999
stopwaitsecs=3600

autostart=true
autorestart=true
user=application

stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; This supresses supervisor (but not horizon) errors on stdout when the command fails
redirect_stderr=true
