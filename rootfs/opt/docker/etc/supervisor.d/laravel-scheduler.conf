[program:laravel-scheduler]
command=/opt/docker/bin/service.d/laravel-optional.sh - schedule:work -v
startretries=9999
stopwaitsecs=3600

autostart=true
autorestart=true
user=application

stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

; This suppresses supervisor (but not scheduler) errors on stdout when the command fails
redirect_stderr=true
