services:
  app:
    # Builds the application image from APP_CONTEXT, which is expected to contain
    # your Laravel application plus the consumer Dockerfile (see ./Dockerfile)
    build:
      context: ${APP_CONTEXT:-.}
    ports:
      - '${HOST_PORT:-8080}:80'
    # https://dockerfile.readthedocs.io/en/latest/content/DockerImages/dockerfiles/php-nginx.html#environment-variables
    environment:
      # Laravel env (prefixed with 'LARAVEL_') is injected into the applications .env on 'env:update'
      - LARAVEL_APP_ENV=production
      - LARAVEL_APP_DEBUG=false
      - LARAVEL_DB_CONNECTION=mysql
      - LARAVEL_DB_HOST=mysql
      - LARAVEL_DB_PORT=3306
      - LARAVEL_DB_DATABASE=${MYSQL_DATABASE}
      - LARAVEL_DB_USERNAME=${MYSQL_USER}
      - LARAVEL_DB_PASSWORD=${MYSQL_PASSWORD}
      - LARAVEL_REDIS_HOST=redis
    volumes:
      - 'app-data:/app/'
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  mysql:
    image: mysql:8
    environment:
      - MYSQL_ROOT_PASSWORD
      - MYSQL_DATABASE
      - MYSQL_USER
      - MYSQL_PASSWORD
    volumes:
      - 'mysql-data:/var/lib/mysql/'
    healthcheck:
      test: [ 'CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-u$MYSQL_USER', '-p$MYSQL_PASSWORD' ]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:alpine
    restart: unless-stopped

volumes:
  app-data:
    driver: local
  mysql-data:
    driver: local
